<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs12</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 12</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לתפעל", russian: "приводить в действие"},
        {hebrew: "לתפקד", russian: "функционировать"},
        {hebrew: "לתפרק", russian: "разбирать"},
        {hebrew: "לתפשר", russian: "идти на компромисс"},
        {hebrew: "לתקוע", russian: "вбивать, застрять"},
        {hebrew: "לתקוף", russian: "атаковать"},
        {hebrew: "לתקיים", russian: "существовать"},
        {hebrew: "לתקלח", russian: "принимать душ"},
        {hebrew: "לתקן", russian: "исправлять"},
        {hebrew: "לתקרב", russian: "приближаться"},
        {hebrew: "להתבודד", russian: "уединяться"},
        {hebrew: "להתכחש", russian: "отрицать, отвергать"},
        {hebrew: "לאטום", russian: "герметизировать"},
        {hebrew: "לארוז", russian: "упаковывать"},
        {hebrew: "לבכות", russian: "плакать"},
        {hebrew: "להעלות", russian: "повышать, поднимать"},
        {hebrew: "להפוך", russian: "переворачивать"},
        {hebrew: "להתפנק", russian: "баловать себя"},
        {hebrew: "להתקשקש", russian: "болтать, сплетничать"},
        {hebrew: "לכבס", russian: "стирать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
