<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs5</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 5</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לשיר", russian: "петь"},
        {hebrew: "לתקדם", russian: "продвигать"},
        {hebrew: "להדליק", russian: "зажигать, включать"},
        {hebrew: "להתפלל", russian: "молиться"},
        {hebrew: "להתחבר", russian: "связываться"},
        {hebrew: "להתעכב", russian: "задерживаться"},
        {hebrew: "להתעלל", russian: "издеваться"},
        {hebrew: "להתעלף", russian: "падать в обморок"},
        {hebrew: "ללבוש", russian: "надевать, носить (одежду)"},
        {hebrew: "להתערב", russian: "вмешиваться"},
        {hebrew: "להתפרנס", russian: "зарабатывать"},
        {hebrew: "להתקיים", russian: "существовать"},
        {hebrew: "להתקרב", russian: "приближаться"},
        {hebrew: "להתרגל", russian: "привыкать"},
        {hebrew: "לחתוך", russian: "резать"},
        {hebrew: "לחתום", russian: "подписывать"},
        {hebrew: "ללחוש", russian: "шептать"},
        {hebrew: "ללטף", russian: "ласкать"},
        {hebrew: "למכור", russian: "продавать"},
        {hebrew: "לנוח", russian: "отдыхать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
