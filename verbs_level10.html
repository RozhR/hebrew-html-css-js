<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs10</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 10</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לשרטט", russian: "чертить, эскизировать"},
        {hebrew: "להתרומם", russian: "возвышаться"},
        {hebrew: "לשתף", russian: "делиться (информацией)"},
        {hebrew: "לתאמן", russian: "тренировать"},
        {hebrew: "לתאר", russian: "описывать"},
        {hebrew: "לתבל", russian: "приправлять"},
        {hebrew: "לתבלט", russian: "выделяться"},
        {hebrew: "לתחזק", russian: "заботиться о состоянии"},
        {hebrew: "לתחקר", russian: "расследовать"},
        {hebrew: "לתכונן", russian: "планировать, подготавливать"},
        {hebrew: "לתכנן", russian: "планировать"},
        {hebrew: "לתכנת", russian: "писать программу"},
        {hebrew: "לתלות", russian: "вешать"},
        {hebrew: "לתמוג", russian: "таять, расплавляться"},
        {hebrew: "לתמוך", russian: "оказывать поддержку"},
        {hebrew: "לתמסר", russian: "отдавать себя делу"},
        {hebrew: "לתמקד", russian: "состредоточить, сфокусировать"},
        {hebrew: "לתמרן", russian: "маневрировать"},
        {hebrew: "להתעלם", russian: "игнорировать, не замечать"},
        {hebrew: "להתנגש", russian: "сталкиваться, ударяться"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
