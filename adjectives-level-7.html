<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives8</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 7</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "גס", russian: "грубый"},
        {hebrew: "שימושי", russian: "полезный"},
        {hebrew: "מיותר", russian: "лишний"},
        {hebrew: "נדיר", russian: "редкий"},
        {hebrew: "נפוץ", russian: "распространённый"},
        {hebrew: "מורכב", russian: "сложный"},
        {hebrew: "רשמי", russian: "официальный"},
        {hebrew: "פרטי", russian: "частный"},
        {hebrew: "עתיק", russian: "древний"},
        {hebrew: "מודרני", russian: "современный"},
        {hebrew: "רגיש", russian: "чувствительный"},
        {hebrew: "חסין", russian: "защищённый"},
        {hebrew: "עיקרי", russian: "основной"},
        {hebrew: "שגרתי", russian: "рутинный"},
        {hebrew: "נדיב", russian: "щедрый"},
        {hebrew: "קמצן", russian: "жадный"},
        {hebrew: "יעיל", russian: "эффективный"},
        {hebrew: "לא יעיל", russian: "неэффективный"},
        {hebrew: "יציב", russian: "устойчивый"},
        {hebrew: "שביר", russian: "хрупкий"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
