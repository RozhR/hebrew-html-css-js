<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs13</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 13</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לנצל", russian: "использовать"},
        {hebrew: "לתקשות", russian: "усложнять"},
        {hebrew: "לתקשר", russian: "контактировать"},
        {hebrew: "לתקתק", russian: "быстро выполнять"},
        {hebrew: "לתרגל", russian: "практиковать"},
        {hebrew: "לתרום", russian: "вносить вклад"},
        {hebrew: "לתרומם", russian: "поднимать, возвышать"},
        {hebrew: "לתרוצץ", russian: "бегать, скакать"},
        {hebrew: "לתרחב", russian: "расширять"},
        {hebrew: "לתרחק", russian: "отдалять"},
        {hebrew: "לתרכז", russian: "концентрировать"},
        {hebrew: "לתרפא", russian: "лечить, исцелять"},
        {hebrew: "לתרפק", russian: "прижимать"},
        {hebrew: "לתרשם", russian: "впечатлять"},
        {hebrew: "להתעצם", russian: "укрепляться, становиться сильнее"},
        {hebrew: "להתפתל", russian: "извиваться, петлять"},
        {hebrew: "להתעדן", russian: "смягчаться, становиться мягче"},
        {hebrew: "לברוח", russian: "убегать"},
        {hebrew: "לגדול", russian: "расти"},
        {hebrew: "לגדל", russian: "выращивать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
