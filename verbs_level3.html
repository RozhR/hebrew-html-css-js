<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs3</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 3</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להסתכל", russian: "смотреть"},
        {hebrew: "להתפלא", russian: "удивляться"},
        {hebrew: "להתפעל", russian: "восхищаться"},
        {hebrew: "להתפרץ", russian: "внезапно появляться, врываться"},
        {hebrew: "להתפרק", russian: "разваливаться, распадаться"},
        {hebrew: "להתפתח", russian: "развиваться"},
        {hebrew: "להתקדם", russian: "продвигаться"},
        {hebrew: "להתקשר", russian: "звонить, связываться"},
        {hebrew: "לשתוק", russian: "молчать"},
        {hebrew: "לרצות", russian: "хотеть"},
        {hebrew: "לרקוד", russian: "танцевать"},
        {hebrew: "לתרחץ", russian: "умываться, мыться"},
        {hebrew: "להתלבש", russian: "одеваться"},
        {hebrew: "להחליף", russian: "менять"},
        {hebrew: "להתעורר", russian: "просыпаться"},
        {hebrew: "להתקלח", russian: "принимать душ"},
        {hebrew: "להרגיע", russian: "успокаивать"},
        {hebrew: "להתאהב", russian: "влюбляться"},
        {hebrew: "להתעניין", russian: "интересоваться"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
