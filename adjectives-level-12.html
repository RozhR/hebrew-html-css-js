<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives12</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 12</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "מיובא", russian: "импортный"},
        {hebrew: "כשר", russian: "кошерный"},
        {hebrew: "טרי", russian: "свежий"},
        {hebrew: "מעופש", russian: "испорченный"},
        {hebrew: "עשיר", russian: "богатый"},
        {hebrew: "עני", russian: "бедный"},
        {hebrew: "צנוע", russian: "скромный"},
        {hebrew: "יומרני", russian: "претенциозный"},
        {hebrew: "עממי", russian: "народный"},
        {hebrew: "טבעי", russian: "естественный"},
        {hebrew: "משמעותי", russian: "значимый"},
        {hebrew: "שולי", russian: "второстепенный"},
        {hebrew: "כפול", russian: "двойной"},
        {hebrew: "משולש", russian: "тройной"},
        {hebrew: "מרובע", russian: "четверной / квадратный"},
        {hebrew: "קריטי", russian: "критический"},
        {hebrew: "חיוני", russian: "жизненно важный"},
        {hebrew: "משני", russian: "несущественный"},
        {hebrew: "עתידי", russian: "будущий"},
        {hebrew: "נוכחי", russian: "текущий"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
