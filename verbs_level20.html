<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs20</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 20</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להשוות", russian: "сравнивать"},
        {hebrew: "להשקות", russian: "поливать"},
        {hebrew: "להשתרע", russian: "растягиваться"},
        {hebrew: "להתאמן", russian: "тренироваться"},
        {hebrew: "להתאמץ", russian: "прилагать усилия"},
        {hebrew: "להתארגן", russian: "организовываться"},
        {hebrew: "להתבדח", russian: "шутить"},
        {hebrew: "להתבדל", russian: "отделяться"},
        {hebrew: "להתבונן", russian: "наблюдать"},
        {hebrew: "להתבייש", russian: "стесняться"},
        {hebrew: "להתבלבל", russian: "запутаться"},
        {hebrew: "להתגבר", russian: "преодолевать"},
        {hebrew: "להתגלות", russian: "обнаруживаться"},
        {hebrew: "להתגלח", russian: "бриться"},
        {hebrew: "להתוודע", russian: "знакомиться"},
        {hebrew: "להתווכח", russian: "спорить"},
        {hebrew: "להתנדנד", russian: "качаться"},
        {hebrew: "להתחדש", russian: "обновляться"},
        {hebrew: "להתחשב", russian: "учитывать"},
        {hebrew: "להתייבש", russian: "сохнуть, высыхать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
