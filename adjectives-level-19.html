<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives19</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 19</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "מפולג", russian: "разделённый"},
        {hebrew: "תקני", russian: "стандартный"},
        {hebrew: "לקוי", russian: "дефектный"},
        {hebrew: "ערכי", russian: "ценностный"},
        {hebrew: "ריקני", russian: "пустой по смыслу"},
        {hebrew: "כוללני", russian: "всеобъемлющий"},
        {hebrew: "נקודתי", russian: "точечный"},
        {hebrew: "רוחבי", russian: "широкий, охватывающий"},
        {hebrew: "עקר", russian: "лишённый смысла"},
        {hebrew: "מכריע", russian: "решающий"},
        {hebrew: "טיפולי", russian: "терапевтический"},
        {hebrew: "מניעתי", russian: "профилактический"},
        {hebrew: "שלילי", russian: "негативный"},
        {hebrew: "חיובי", russian: "позитивный"},
        {hebrew: "נוקב", russian: "резкий"},
        {hebrew: "עדכני", russian: "актуальный"},
        {hebrew: "בלוי", russian: "изношенный"},
        {hebrew: "מרענן", russian: "освежающий"},
        {hebrew: "מבלבל", russian: "запутывающий"},
        {hebrew: "מוגדר", russian: "определённый"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
