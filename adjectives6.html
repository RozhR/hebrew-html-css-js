<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives6</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 6</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "ראשי", russian: "главный"},
        {hebrew: "משני", russian: "второстепенный"},
        {hebrew: "מרכזי", russian: "центральный"},
        {hebrew: "קדמי", russian: "передний"},
        {hebrew: "אחורי", russian: "задний"},
        {hebrew: "מקומי", russian: "местный"},
        {hebrew: "כללי", russian: "общий"},
        {hebrew: "מיומן", russian: "опытный"},
        {hebrew: "נוסף", russian: "дополнительный"},
        {hebrew: "בינוני", russian: "средний"},
        {hebrew: "קבוע", russian: "постоянный"},
        {hebrew: "זמני", russian: "временный"},
        {hebrew: "שקוף", russian: "прозрачный"},
        {hebrew: "כהה", russian: "тёмный"},
        {hebrew: "בהיר", russian: "светлый"},
        {hebrew: "פשוט", russian: "простой"},
        {hebrew: "מסובך", russian: "сложный"},
        {hebrew: "מדויק", russian: "точный"},
        {hebrew: "גבישי", russian: "кристаллический"},
        {hebrew: "עדין", russian: "нежный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
