<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives11</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 11</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "חם לב", russian: "сердечный"},
        {hebrew: "קר רוח", russian: "хладнокровный"},
        {hebrew: "מרובע", russian: "квадратный"},
        {hebrew: "עגול", russian: "круглый"},
        {hebrew: "משולש", russian: "треугольный"},
        {hebrew: "יצירתי", russian: "творческий"},
        {hebrew: "שמרני", russian: "консервативный"},
        {hebrew: "חדשני", russian: "инновационный"},
        {hebrew: "פגיע", russian: "уязвимый"},
        {hebrew: "עמיד", russian: "стойкий"},
        {hebrew: "מוקפד", russian: "аккуратный"},
        {hebrew: "רשלני", russian: "небрежный"},
        {hebrew: "עכשווי", russian: "актуальный"},
        {hebrew: "ישן נושן", russian: "древний"},
        {hebrew: "מתמשך", russian: "продолжающийся"},
        {hebrew: "חולף", russian: "мимолётный"},
        {hebrew: "אזורי", russian: "региональный"},
        {hebrew: "ארצי", russian: "национальный"},
        {hebrew: "עולמי", russian: "мировой"},
        {hebrew: "נצחי", russian: "вечный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
