<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs11</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 11</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להתיידד", russian: "подружиться"},
        {hebrew: "להתפלץ", russian: "пугаться, испугаться"},
        {hebrew: "להתגלגל", russian: "катиться, вертеться"},
        {hebrew: "להתמכר", russian: "пристраститься, зависеть"},
        {hebrew: "להתמלא", russian: "наполняться"},
        {hebrew: "להתנשק", russian: "целоваться"},
        {hebrew: "להתקפל", russian: "складываться"},
        {hebrew: "לזמזם", russian: "напевать"},
        {hebrew: "לחסוך", russian: "экономить"},
        {hebrew: "לנמנם", russian: "дремать"},
        {hebrew: "לפּרוץ", russian: "ломать, прорываться"},
        {hebrew: "לתעד", russian: "документировать"},
        {hebrew: "לתעדכן", russian: "обновлять"},
        {hebrew: "לתעדן", russian: "смягчать"},
        {hebrew: "לתעל", russian: "направлять поток"},
        {hebrew: "לתפוג", russian: "истекать, исчезать"},
        {hebrew: "לתפוס", russian: "занимать, ловить"},
        {hebrew: "לתפור", russian: "шить"},
        {hebrew: "לתפוש", russian: "схватывать, ловить"},
        {hebrew: "לתפנק", russian: "баловать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
