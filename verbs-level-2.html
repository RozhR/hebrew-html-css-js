<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs2</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 2</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לראות", russian: "видеть"},
        {hebrew: "לרדת", russian: "спускаться"},
        {hebrew: "לרוץ", russian: "бегать"},
        {hebrew: "לשאול", russian: "спрашивать"},
        {hebrew: "לשחק", russian: "играть"},
        {hebrew: "לשמוע", russian: "слышать"},
        {hebrew: "לשמור", russian: "хранить, охранять"},
        {hebrew: "לשתות", russian: "пить"},
        {hebrew: "לבקש", russian: "просить"},
        {hebrew: "לבשל", russian: "готовить еду"},
        {hebrew: "להרגיש", russian: "чувствовать"},
        {hebrew: "להתחיל", russian: "начинать"},
        {hebrew: "להתרגש", russian: "волноваться"},
        {hebrew: "לחפש", russian: "искать"},
        {hebrew: "לכתוב", russian: "писать"},
        {hebrew: "למצוא", russian: "находить"},
        {hebrew: "לספר", russian: "рассказывать"},
        {hebrew: "לצחוק", russian: "смеяться"},
        {hebrew: "לבוא", russian: "приходить"},
        {hebrew: "לברר", russian: "выяснять, разбираться"},
        {hebrew: "להסביר", russian: "объяснять"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
