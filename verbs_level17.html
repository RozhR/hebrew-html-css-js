<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs17</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 17</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להימשך", russian: "продолжаться"},
        {hebrew: "להימתח", russian: "растягиваться"},
        {hebrew: "להינשא", russian: "жениться, выходить замуж"},
        {hebrew: "להיסגר", russian: "закрываться"},
        {hebrew: "להיסחף", russian: "быть увлечённым"},
        {hebrew: "להיסתכל", russian: "наблюдать"},
        {hebrew: "להיעדכן", russian: "быть обновлённым"},
        {hebrew: "להיעזר", russian: "обращаться за помощью"},
        {hebrew: "להיעלב", russian: "обижаться"},
        {hebrew: "להיעלם", russian: "исчезать"},
        {hebrew: "להיענות", russian: "соглашаться"},
        {hebrew: "להיענק", russian: "быть удушенным"},
        {hebrew: "להיענש", russian: "быть наказанным"},
        {hebrew: "להיעצר", russian: "быть остановленным"},
        {hebrew: "להיערך", russian: "готовиться"},
        {hebrew: "להיעתר", russian: "соглашаться"},
        {hebrew: "להיפגע", russian: "быть оскорблённым, пострадать"},
        {hebrew: "להתמקד", russian: "сосредоточиться, сфокусироваться"},
        {hebrew: "להתמרכז", russian: "концентрироваться"},
        {hebrew: "להתנצל", russian: "извиняться"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
