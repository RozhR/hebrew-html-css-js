<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs14</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 14</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לגלוש", russian: "серфить, скользить"},
        {hebrew: "לגלות", russian: "обнаруживать"},
        {hebrew: "לגעור", russian: "ругать"},
        {hebrew: "לגעת", russian: "трогать"},
        {hebrew: "לגרד", russian: "чесать"},
        {hebrew: "לגרום", russian: "вызывать, причинять"},
        {hebrew: "לגרור", russian: "тянуть, волочить"},
        {hebrew: "לדחות", russian: "откладывать"},
        {hebrew: "להאט", russian: "замедлять"},
        {hebrew: "להאיץ", russian: "ускорять"},
        {hebrew: "להאמין", russian: "верить"},
        {hebrew: "להביט", russian: "наблюдать"},
        {hebrew: "להדביק", russian: "приклеивать, заражать"},
        {hebrew: "להוסיף", russian: "добавлять"},
        {hebrew: "להוציא", russian: "вынимать"},
        {hebrew: "להוריד", russian: "снижать, скачивать"},
        {hebrew: "להחביא", russian: "прятать"},
        {hebrew: "להחליט", russian: "решать"},
        {hebrew: "להתנסות", russian: "испытывать, пробовать"},
        {hebrew: "להתנפל", russian: "нападать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
