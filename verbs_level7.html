<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs7</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 7</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להיפגש", russian: "встречаться"},
        {hebrew: "להיפרד", russian: "расставаться"},
        {hebrew: "להתעקש", russian: "настаивать"},
        {hebrew: "להתייחס", russian: "относиться"},
        {hebrew: "להתפטר", russian: "увольняться"},
        {hebrew: "להתקשות", russian: "становиться трудным"},
        {hebrew: "להתרחץ", russian: "мыться"},
        {hebrew: "להתרחש", russian: "происходить"},
        {hebrew: "להתריע", russian: "предупреждать"},
        {hebrew: "להתרכז", russian: "концентрироваться"},
        {hebrew: "להתרפא", russian: "выздоравливать, лечиться"},
        {hebrew: "להתרשם", russian: "впечатляться"},
        {hebrew: "לזכות", russian: "выигрывать, заслуживать"},
        {hebrew: "לחגוג", russian: "праздновать"},
        {hebrew: "לטלטל", russian: "трясти"},
        {hebrew: "ללגלג", russian: "насмехаться"},
        {hebrew: "ללחום", russian: "сражаться, бороться"},
        {hebrew: "למנוע", russian: "предотвращать"},
        {hebrew: "לנהוג", russian: "водить (машину)"},
        {hebrew: "לרחוץ", russian: "мыть"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
