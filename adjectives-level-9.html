<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives9</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 9</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "חיצוני", russian: "внешний"},
        {hebrew: "מושלם", russian: "идеальный"},
        {hebrew: "פגום", russian: "дефектный"},
        {hebrew: "עמוס", russian: "нагруженный"},
        {hebrew: "קליל", russian: "лёгкий (впечатление)"},
        {hebrew: "עקרוני", russian: "принципиальный"},
        {hebrew: "מוסרי", russian: "нравственный"},
        {hebrew: "פיזי", russian: "физический"},
        {hebrew: "נפשי", russian: "психический"},
        {hebrew: "רפואי", russian: "медицинский"},
        {hebrew: "מדעי", russian: "научный"},
        {hebrew: "מסחרי", russian: "коммерческий"},
        {hebrew: "צבאי", russian: "военный"},
        {hebrew: "אזרחי", russian: "гражданский"},
        {hebrew: "חברתי", russian: "социальный"},
        {hebrew: "תרבותי", russian: "культурный"},
        {hebrew: "מוזיקלי", russian: "музыкальный"},
        {hebrew: "חגיגי", russian: "праздничный"},
        {hebrew: "חשאי", russian: "секретный"},
        {hebrew: "גלוי", russian: "открытый, явный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
