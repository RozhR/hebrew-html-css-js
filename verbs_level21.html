<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs21</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 21</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להתכונן", russian: "готовиться, приготовиться"},
        {hebrew: "להתכנס", russian: "собираться"},
        {hebrew: "להתלבט", russian: "сомневаться"},
        {hebrew: "להתלבלב", russian: "расцветать"},
        {hebrew: "להתלונן", russian: "жаловаться"},
        {hebrew: "להתלחש", russian: "шептаться"},
        {hebrew: "להתלכד", russian: "объединяться"},
        {hebrew: "להתלמד", russian: "изучать"},
        {hebrew: "להתמיד", russian: "упорно продолжать, настойчиво делать"},
        {hebrew: "להתמסר", russian: "отдавать себя"},
        {hebrew: "להתמרח", russian: "намазываться (кремом)"},
        {hebrew: "להתנדב", russian: "добровольно помогать"},
        {hebrew: "להתנפח", russian: "раздуваться"},
        {hebrew: "להתעמק", russian: "углубляться (в знаниях)"},
        {hebrew: "להתענג", russian: "наслаждаться"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
