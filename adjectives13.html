<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives13</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 13</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "קודם", russian: "предыдущий"},
        {hebrew: "תמוה", russian: "удивительный"},
        {hebrew: "מפתיע", russian: "неожиданный"},
        {hebrew: "צפוי", russian: "ожидаемый"},
        {hebrew: "רדיקלי", russian: "радикальный"},
        {hebrew: "משופר", russian: "улучшенный"},
        {hebrew: "מוצלח", russian: "успешный"},
        {hebrew: "נכשל", russian: "провалившийся"},
        {hebrew: "רווחי", russian: "прибыльный"},
        {hebrew: "הפסדי", russian: "убыточный"},
        {hebrew: "שקול", russian: "взвешенный"},
        {hebrew: "קיצוני", russian: "экстремальный"},
        {hebrew: "מדורג", russian: "поэтапный"},
        {hebrew: "ישיר", russian: "прямой"},
        {hebrew: "עקיף", russian: "косвенный"},
        {hebrew: "הרמוני", russian: "гармоничный"},
        {hebrew: "דיסוננטי", russian: "диссонансный"},
        {hebrew: "מרווח", russian: "просторный"},
        {hebrew: "דחוס", russian: "сжатый"},
        {hebrew: "אינסופי", russian: "бесконечный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
