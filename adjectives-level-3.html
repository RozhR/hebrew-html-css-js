<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives3</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 3</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "עסוק", russian: "занятой"},
        {hebrew: "נוח", russian: "удобный"},
        {hebrew: "לא נוח", russian: "неудобный"},
        {hebrew: "מתוק", russian: "сладкий"},
        {hebrew: "מר", russian: "горький"},
        {hebrew: "מלוח", russian: "солёный"},
        {hebrew: "חמוץ", russian: "кислый"},
        {hebrew: "חריף", russian: "острый"},
        {hebrew: "רך", russian: "мягкий"},
        {hebrew: "קשה", russian: "твёрдый"},
        {hebrew: "נעים", russian: "приятный"},
        {hebrew: "לא נעים", russian: "неприятный"},
        {hebrew: "מפורסם", russian: "известный"},
        {hebrew: "לא ידוע", russian: "неизвестный"},
        {hebrew: "בריא", russian: "здоровый"},
        {hebrew: "חולה", russian: "больной"},
        {hebrew: "שמן", russian: "толстый"},
        {hebrew: "רזה", russian: "худой"},
        {hebrew: "חשוב", russian: "важный"},
        {hebrew: "לא חשוב", russian: "неважный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
