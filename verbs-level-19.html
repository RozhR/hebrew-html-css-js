<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs19</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 19</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להסתלק", russian: "уходить"},
        {hebrew: "להסתער", russian: "штурмовать"},
        {hebrew: "להסתתר", russian: "прятаться"},
        {hebrew: "להעריך", russian: "оценивать"},
        {hebrew: "להפסיד", russian: "проигрывать"},
        {hebrew: "להפסיק", russian: "прекращать"},
        {hebrew: "להצחיק", russian: "смешить"},
        {hebrew: "להצטטט", russian: "бродить без цели"},
        {hebrew: "להצטייד", russian: "снабжаться"},
        {hebrew: "להצטיין", russian: "преуспевать"},
        {hebrew: "להצטלם", russian: "фотографироваться"},
        {hebrew: "להציג", russian: "представлять, показывать"},
        {hebrew: "להציע", russian: "предлагать"},
        {hebrew: "להתחבא", russian: "прятаться"},
        {hebrew: "להתחלק", russian: "делиться"},
        {hebrew: "להתנשף", russian: "задыхаться"},
        {hebrew: "להקליט", russian: "записывать"},
        {hebrew: "להרוס", russian: "разрушать"},
        {hebrew: "להרים", russian: "поднимать"},
        {hebrew: "להרשות", russian: "разрешать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
