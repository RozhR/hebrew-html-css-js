<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives17</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 17</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "איכותי", russian: "качественный"},
        {hebrew: "נחות", russian: "низкокачественный"},
        {hebrew: "רציני", russian: "серьёзный"},
        {hebrew: "קליל", russian: "лёгкий"},
        {hebrew: "חובבני", russian: "любительский"},
        {hebrew: "מקצועי", russian: "профессиональный"},
        {hebrew: "ראשוני", russian: "первичный"},
        {hebrew: "סופי", russian: "окончательный"},
        {hebrew: "תקופתי", russian: "периодический"},
        {hebrew: "רציף", russian: "непрерывный"},
        {hebrew: "קטוע", russian: "прерывистый"},
        {hebrew: "הרפתקני", russian: "авантюрный"},
        {hebrew: "ממושמע", russian: "дисциплинированный"},
        {hebrew: "מרדני", russian: "бунтарский"},
        {hebrew: "רציונלי", russian: "рациональный"},
        {hebrew: "רגשי", russian: "эмоциональный"},
        {hebrew: "סובייקטיבי", russian: "субъективный"},
        {hebrew: "אובייקטיבי", russian: "объективный"},
        {hebrew: "נוח לשימוש", russian: "удобный в использовании"},
        {hebrew: "מסורבל", russian: "неуклюжий"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
