<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives18</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 18</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "מעוצב", russian: "дизайнерский"},
        {hebrew: "עשוי היטב", russian: "хорошо сделанный"},
        {hebrew: "קשיח", russian: "жёсткий"},
        {hebrew: "ריחני", russian: "ароматный"},
        {hebrew: "מסריח", russian: "вонючий"},
        {hebrew: "טעים", russian: "вкусный"},
        {hebrew: "תפל", russian: "пресный"},
        {hebrew: "מהודק", russian: "плотный"},
        {hebrew: "רפוי", russian: "рыхлый"},
        {hebrew: "מתוח", russian: "натянутый"},
        {hebrew: "מהוסס", russian: "колеблющийся"},
        {hebrew: "נחוש", russian: "решительный"},
        {hebrew: "אמיץ", russian: "смелый"},
        {hebrew: "פחדן", russian: "трусливый"},
        {hebrew: "מופנם", russian: "замкнутый"},
        {hebrew: "אופטימי", russian: "оптимистичный"},
        {hebrew: "פסימי", russian: "пессимистичный"},
        {hebrew: "ריאליסטי", russian: "реалистичный"},
        {hebrew: "דמיוני", russian: "воображаемый"},
        {hebrew: "מגובש", russian: "сплочённый"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
