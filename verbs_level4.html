<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs4</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 4</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לזוז", russian: "двигаться"},
        {hebrew: "לחבק", russian: "обнимать"},
        {hebrew: "לחיות", russian: "жить"},
        {hebrew: "לטוס", russian: "летать"},
        {hebrew: "לטייל", russian: "гулять, путешествовать"},
        {hebrew: "לישון", russian: "спать"},
        {hebrew: "לכבד", russian: "уважать"},
        {hebrew: "לכבות", russian: "гасить, выключать"},
        {hebrew: "לכעוס", russian: "злиться"},
        {hebrew: "ללחוץ", russian: "нажимать"},
        {hebrew: "למרוח", russian: "мазать"},
        {hebrew: "למתוח", russian: "растягивать"},
        {hebrew: "לנגב", russian: "вытирать"},
        {hebrew: "לנסות", russian: "пробовать"},
        {hebrew: "לסגור", russian: "закрывать"},
        {hebrew: "לסיים", russian: "заканчивать"},
        {hebrew: "לפחד", russian: "бояться"},
        {hebrew: "לקנות", russian: "покупать"},
        {hebrew: "לקפוץ", russian: "прыгать"},
        {hebrew: "לשבת", russian: "сидеть"},
        {hebrew: "לשחות", russian: "плавать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
