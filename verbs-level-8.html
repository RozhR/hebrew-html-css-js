<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs8</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 8</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "לרכוב", russian: "ездить верхом"},
        {hebrew: "לרפא", russian: "лечить"},
        {hebrew: "לשאוף", russian: "стремиться"},
        {hebrew: "לשבור", russian: "ломать"},
        {hebrew: "לשטוף", russian: "мыть"},
        {hebrew: "לשכב", russian: "лежать"},
        {hebrew: "לשכוח", russian: "забывать"},
        {hebrew: "לשכור", russian: "арендовать"},
        {hebrew: "לשכנע", russian: "убеждать"},
        {hebrew: "לשכפל", russian: "дублировать"},
        {hebrew: "לשמוח", russian: "радоваться"},
        {hebrew: "לשנוא", russian: "ненавидеть"},
        {hebrew: "לשנות", russian: "изменять"},
        {hebrew: "לשנן", russian: "заучивать"},
        {hebrew: "לתעורר", russian: "пробуждаться"},
        {hebrew: "להתפשט", russian: "слегка раздеваться, расправляться"},
        {hebrew: "להתגונן", russian: "защищаться"},
        {hebrew: "להתכווץ", russian: "сжиматься, сокращаться"},
        {hebrew: "להתכופף", russian: "наклоняться, сгибаться"},
        {hebrew: "להתייעץ", russian: "советоваться"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
