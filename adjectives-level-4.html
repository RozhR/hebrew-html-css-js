<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives4</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 4</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "רגיל", russian: "обычный"},
        {hebrew: "מיוחד", russian: "особенный"},
        {hebrew: "שלם", russian: "целый"},
        {hebrew: "שבור", russian: "сломанный"},
        {hebrew: "פתוח", russian: "открытый"},
        {hebrew: "סגור", russian: "закрытый"},
        {hebrew: "מלא", russian: "полный"},
        {hebrew: "ריק", russian: "пустой"},
        {hebrew: "חי", russian: "живой"},
        {hebrew: "מת", russian: "мёртвый"},
        {hebrew: "ברור", russian: "ясный"},
        {hebrew: "עמום", russian: "размытый, неясный"},
        {hebrew: "מאוחר", russian: "поздний"},
        {hebrew: "מוקדם", russian: "ранний"},
        {hebrew: "אפשרי", russian: "возможный"},
        {hebrew: "בלתי אפשרי", russian: "невозможный"},
        {hebrew: "מסוכן", russian: "опасный"},
        {hebrew: "בטוח", russian: "безопасный"},
        {hebrew: "מאושר", russian: "счастливый"},
        {hebrew: "עצוב", russian: "грустный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
