<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives16</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 16</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "כאוטי", russian: "хаотичный"},
        {hebrew: "בלתי רגיל", russian: "необычный"},
        {hebrew: "מכביד", russian: "утомительный"},
        {hebrew: "משרדי", russian: "офисный"},
        {hebrew: "משפחתי", russian: "семейный"},
        {hebrew: "נפלא", russian: "прекрасный"},
        {hebrew: "מזעזע", russian: "ужасающий"},
        {hebrew: "נוזלי", russian: "жидкий"},
        {hebrew: "מוצק", russian: "твёрдый"},
        {hebrew: "נדיף", russian: "летучий"},
        {hebrew: "כבול", russian: "связанный"},
        {hebrew: "פריך", russian: "хрустящий"},
        {hebrew: "נימוח", russian: "тающий"},
        {hebrew: "בררני", russian: "разборчивый"},
        {hebrew: "פשוט לב", russian: "простодушный"},
        {hebrew: "נייטרלי", russian: "нейтральный"},
        {hebrew: "מוטה", russian: "предвзятый"},
        {hebrew: "מובחן", russian: "различимый"},
        {hebrew: "מטושטש", russian: "размытый"},
        {hebrew: "אותנטי", russian: "аутентичный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
