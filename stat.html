<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"></nav>

<h1 style="text-align:center; margin-top:20px;">Статистика</h1>

<div id="statsContainer"
     style="width:90%; margin:20px auto; display:flex; gap:20px; justify-content:center; flex-wrap:wrap;">
    <div class="stats-column" id="verbsColumn" style="flex:1; min-width:250px;">
        <h2>Глаголы</h2>
    </div>
    <div class="stats-column" id="adjectivesColumn" style="flex:1; min-width:250px;">
        <h2>Прилагательные</h2>
    </div>
    <div class="stats-column" id="adverbsColumn" style="flex:1; min-width:250px;">
        <h2>Наречия</h2>
    </div>
</div>

<div style="text-align:center; margin:40px 0;">
    <button
            class="styled-btn"
            id="clearStatisticsBtn">
        Очистить статистику
    </button>
</div>

<script src="js/script.js"></script>
<script src="js/menu.js"></script>
<script>
    loadMenu();
    loadStatistics();
</script>
</body>
</html>
