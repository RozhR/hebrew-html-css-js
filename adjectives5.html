<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives5</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 5</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "כועס", russian: "сердитый"},
        {hebrew: "מפוחד", russian: "испуганный"},
        {hebrew: "רגוע", russian: "спокойный"},
        {hebrew: "עייף", russian: "уставший"},
        {hebrew: "ער", russian: "бодрый"},
        {hebrew: "יבש", russian: "сухой"},
        {hebrew: "רטוב", russian: "мокрый"},
        {hebrew: "נקי", russian: "чистый"},
        {hebrew: "מלוכלך", russian: "грязный"},
        {hebrew: "קרוב", russian: "близкий"},
        {hebrew: "רחוק", russian: "далёкий"},
        {hebrew: "שונה", russian: "другой"},
        {hebrew: "דומה", russian: "похожий"},
        {hebrew: "אמיתי", russian: "настоящий"},
        {hebrew: "מזויף", russian: "поддельный"},
        {hebrew: "אישי", russian: "личный"},
        {hebrew: "ציבורי", russian: "общественный"},
        {hebrew: "חשמלי", russian: "электрический"},
        {hebrew: "טבעי", russian: "натуральный"},
        {hebrew: "מלאכותי", russian: "искусственный"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
