<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs16</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 16</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להיזהר", russian: "быть осторожным"},
        {hebrew: "להיזכר", russian: "вспоминать"},
        {hebrew: "להיזרק", russian: "быть выброшенным"},
        {hebrew: "להיחנק", russian: "задыхаться"},
        {hebrew: "להיחשב", russian: "считаться"},
        {hebrew: "להיחשף", russian: "быть раскрытым"},
        {hebrew: "להיטפל", russian: "приставать"},
        {hebrew: "להיכחד", russian: "исчезнуть, вымереть"},
        {hebrew: "להיכנס", russian: "входить"},
        {hebrew: "להתגעגע", russian: "скучать"},
        {hebrew: "להתחתן", russian: "жениться/выходить замуж"},
        {hebrew: "להתנגד", russian: "сопротивляться"},
        {hebrew: "להתעמל", russian: "тренироваться, заниматься спортом"},
        {hebrew: "לזנק", russian: "резко прыгать"},
        {hebrew: "להיכנע", russian: "сдаваться"},
        {hebrew: "להיכשל", russian: "проваливаться"},
        {hebrew: "להימלט", russian: "сбегать"},
        {hebrew: "להימנע", russian: "воздерживаться"},
        {hebrew: "להימצא", russian: "находиться"},
        {hebrew: "להימרח", russian: "мазать"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
