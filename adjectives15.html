<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives15</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 15</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "מפוזר", russian: "рассеянный"},
        {hebrew: "שיטתי", russian: "систематичный"},
        {hebrew: "אינטואיטיבי", russian: "интуитивный"},
        {hebrew: "אוניברסלי", russian: "универсальный"},
        {hebrew: "מסורתי", russian: "традиционный"},
        {hebrew: "דליל", russian: "редкий (о веществе)"},
        {hebrew: "זעיר", russian: "крошечный"},
        {hebrew: "מגושם", russian: "неуклюжий"},
        {hebrew: "אלגנטי", russian: "элегантный"},
        {hebrew: "מדוכדך", russian: "подавленный"},
        {hebrew: "נלהב", russian: "восторженный"},
        {hebrew: "פסיבי", russian: "пассивный"},
        {hebrew: "אקטיבי", russian: "активный"},
        {hebrew: "עתיר", russian: "богатый чем-либо"},
        {hebrew: "דל", russian: "бедный чем-либо"},
        {hebrew: "סוער", russian: "бурный"},
        {hebrew: "רווי", russian: "насыщенный"},
        {hebrew: "דלוח", russian: "мутный"},
        {hebrew: "טבוע", russian: "врождённый"},
        {hebrew: "נרכש", russian: "приобретённый"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
