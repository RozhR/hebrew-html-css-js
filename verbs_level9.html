<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verbs9</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 9</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "להתפוצץ", russian: "взрываться, лопаться"},
        {hebrew: "להתעדכן", russian: "обновляться"},
        {hebrew: "להתפייס", russian: "мириться"},
        {hebrew: "להתרוצץ", russian: "бегать туда-сюда, метаться"},
        {hebrew: "להתרחב", russian: "расширяться"},
        {hebrew: "להתרחק", russian: "отдаляться"},
        {hebrew: "להתרפק", russian: "прижиматься"},
        {hebrew: "לחקור", russian: "исследовать"},
        {hebrew: "לייבש", russian: "сушить"},
        {hebrew: "ללבות", russian: "разжигать"},
        {hebrew: "ללמד", russian: "преподавать"},
        {hebrew: "למות", russian: "умирать"},
        {hebrew: "לנחות", russian: "приземляться"},
        {hebrew: "לנער", russian: "встряхивать"},
        {hebrew: "לפנות", russian: "обращаться, поворачивать"},
        {hebrew: "לשפוך", russian: "проливать"},
        {hebrew: "לשפר", russian: "улучшать"},
        {hebrew: "לשקול", russian: "взвешивать"},
        {hebrew: "לשרוד", russian: "выживать"},
        {hebrew: "לשרוק", russian: "свистеть"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
