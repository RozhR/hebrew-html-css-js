<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adjectives10</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="functions">
    <button class="styled-btn" onclick="shuffleCards()">Перемешать</button>
    <button class="styled-btn" onclick="startTest()">Тестирование</button>
</div>

<h2 id="levelTitle">Уровень 10</h2>

<div class="card-container" id="cardContainer"></div>

<script src="menu.js"></script>
<script>loadMenu();</script>
<script src="script.js"></script>

<script>
    /* =================== ДАННЫЕ КАРТОЧЕК =================== */
    const cardsData = [
        {hebrew: "נוקשה", russian: "жёсткий"},
        {hebrew: "גמיש", russian: "гибкий"},
        {hebrew: "מוליך", russian: "проводящий"},
        {hebrew: "מבודד", russian: "изолирующий"},
        {hebrew: "נייד", russian: "мобильный"},
        {hebrew: "נייח", russian: "стационарный"},
        {hebrew: "מרשים", russian: "впечатляющий"},
        {hebrew: "עלוב", russian: "убогий"},
        {hebrew: "פורח", russian: "цветущий"},
        {hebrew: "קמל", russian: "увядший"},
        {hebrew: "עקר", russian: "бесплодный"},
        {hebrew: "פורה", russian: "плодородный"},
        {hebrew: "דק", russian: "тонкий"},
        {hebrew: "עבה", russian: "толстый"},
        {hebrew: "קליט", russian: "легко запоминающийся"},
        {hebrew: "טעון", russian: "нагруженный (эмоционально/физически)"},
        {hebrew: "מאורגן", russian: "организованный"},
        {hebrew: "מפוזר", russian: "рассеянный"},
        {hebrew: "מנומס", russian: "вежливый"},
        {hebrew: "גס רוח", russian: "невежливый"}
    ];

    /* =================== ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ КАРТОЧЕК =================== */
    function generateCards(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // очищаем перед генерацией

        data.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.hebrew}</div>
                <div class="card-back">${card.russian}</div>
            </div>
        `;
            container.appendChild(cardEl);
        });

        // Добавляем обработчик переворота
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", () => card.classList.toggle("flipped"));
        });
    }

    /* =================== ИНИЦИАЛИЗАЦИЯ =================== */
    document.addEventListener("DOMContentLoaded", () => {
        generateCards('cardContainer', cardsData);
    });
</script>

</body>
</html>
